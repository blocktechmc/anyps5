# AnyPS5 automated Windows build verification
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

env:
  CONFIGURE: >-
    -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
    -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
    -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

jobs:
  eligibility:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      relinker: ${{ steps.gate.outputs.relinker }}
      full: ${{ steps.gate.outputs.full }}
    steps:
      - uses: actions/github-script@v8
        id: gate
        env:
          PR_NUMBER: ${{ inputs.pr }}
        with:
          script: |
            if (context.eventName === 'push') {
              if (context.ref !== 'refs/heads/main') {
                throw new Error('Automatic full builds only run on main');
              }
              core.setOutput('sha', context.sha);
              core.setOutput('relinker', true);
              core.setOutput('full', true);
              await core.summary.addRaw(`Building main at ${context.sha}: all builds and tests enabled`).write();
              return;
            }
            const { owner, repo } = context.repo;
            const manual = context.eventName === 'workflow_dispatch';
            if (manual) {
              for (const username of new Set([context.actor, process.env.GITHUB_TRIGGERING_ACTOR])) {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username });
                if (!['write', 'maintain', 'admin'].includes(data.permission)) {
                  throw new Error('Only collaborators with write access can start or rerun builds');
                }
              }
              if (!/^[1-9][0-9]*$/.test(process.env.PR_NUMBER)) {
                throw new Error('Enter a positive pull request number');
              }
            }
            const pull_number = manual ? Number(process.env.PR_NUMBER) : context.payload.pull_request.number;
            if (!Number.isSafeInteger(pull_number) || pull_number < 1) {
              throw new Error('Invalid pull request number');
            }
            let { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            for (let attempt = 0; pr.mergeable === null && attempt < 10; ++attempt) {
              await new Promise((resolve) => setTimeout(resolve, 3000));
              ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number }));
            }
            if (pr.state !== 'open' || pr.base.ref !== 'main') {
              throw new Error('The pull request must be open and target main');
            }
            if (!manual && pr.head.sha !== context.payload.pull_request.head.sha) {
              throw new Error('The pull request has newer commits; use the latest run');
            }
            if (pr.mergeable !== true || !pr.merge_commit_sha) {
              throw new Error('The pull request does not merge cleanly into main; rebase it first');
            }
            let relinker = manual;
            if (!manual) {
              const { data: commits } = await github.rest.repos.listCommits({
                owner, repo, sha: 'main', author: pr.user.login, per_page: 1
              });
              relinker = commits.length > 0;
            }
            core.setOutput('sha', pr.merge_commit_sha);
            core.setOutput('relinker', relinker);
            core.setOutput('full', manual);
            await core.summary.addRaw(
              `PR #${pull_number} at ${pr.head.sha} merged into main as ${pr.merge_commit_sha}: full builds ${manual ? 'enabled' : 'disabled'}, ` +
              `relinker ${relinker ? 'enabled' : 'skipped because the author has no commit in main'}`
            ).write();

  relinker:
    needs: eligibility
    if: ${{ needs.eligibility.outputs.relinker == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
          - os: windows-latest
            compiler: g++
          - os: macos-latest
            compiler: clang++
    env:
      WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
      WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.eligibility.outputs.sha }}
          persist-credentials: false
      - if: runner.os == 'Windows'
        id: toolchain
        uses: actions/cache@v6
        with:
          path: C:\winlibs
          key: ${{ env.WINLIBS_ZIP }}
      - if: runner.os == 'Windows' && steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
      - if: runner.os == 'Windows'
        run: echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
      - run: cmake -S . -B build-relinker -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DANYPS5_RELINKER_ONLY=ON -DBUILD_TESTING=ON
      - run: cmake --build build-relinker --parallel 3
      - run: ctest --test-dir build-relinker --output-on-failure --timeout 120

  linux:
    needs: eligibility
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.eligibility.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.eligibility.outputs.sha }}
          persist-credentials: false
          submodules: true
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: linux
          save: false
          evict-old-files: job
      - name: Install lavapipe for the GPU execution tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers
      - run: cmake -S . -B build $CONFIGURE -DANYPS5_ENABLE_SPIRV_TOOLS=ON
      - name: Check that every test executable is registered with ctest
        run: python3 tools/check_test_registration.py build
      - run: cmake --build build
      - run: cmake --build build --target libs
      - run: ctest --test-dir build --output-on-failure --timeout 120 --parallel 4 --output-log ctest.log
        env:
          ANYPS5_REQUIRE_VULKAN: 1
          GALLIUM_OVERRIDE_CPU_CAPS: avx
      - name: Report tests slower than 30 s
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          [ -f ctest.log ] || exit 0
          awk '/Test +#[0-9]+: / && $NF == "sec" { for (i = 1; i <= NF; i++) if ($i ~ /^#[0-9]+:$/) name = $(i + 1); t = $(NF - 1) + 0; if (t > max[name]) max[name] = t }
            END { for (name in max) if (max[name] > 30) printf "::warning title=Slow test::%s took %.1f s on %s; tests must finish in 30 s (CONTRIBUTING.md)\n", name, max[name], ENVIRON["RUNNER_OS"] }' ctest.log

  windows:
    needs: eligibility
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.eligibility.outputs.full == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
      WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
      SSL_CERT_FILE: C:\Program Files\Git\mingw64\etc\ssl\certs\ca-bundle.crt
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.eligibility.outputs.sha }}
          persist-credentials: false
          submodules: true
      - id: toolchain
        uses: actions/cache@v6
        with:
          path: C:\winlibs
          key: ${{ env.WINLIBS_ZIP }}
      - if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
      - run: echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: windows
          save: false
          evict-old-files: job
      - shell: cmd
        run: cmake -S . -B build %CONFIGURE%
      - name: Check that every test executable is registered with ctest
        shell: cmd
        run: python tools/check_test_registration.py build
      - shell: cmd
        run: cmake --build build
      - shell: cmd
        run: cmake --build build --target libs
      - shell: cmd
        run: ctest --test-dir build --output-on-failure --timeout 120 --parallel 4 --output-log ctest.log
      - name: Report tests slower than 30 s
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          [ -f ctest.log ] || exit 0
          awk '/Test +#[0-9]+: / && $NF == "sec" { for (i = 1; i <= NF; i++) if ($i ~ /^#[0-9]+:$/) name = $(i + 1); t = $(NF - 1) + 0; if (t > max[name]) max[name] = t }
            END { for (name in max) if (max[name] > 30) printf "::warning title=Slow test::%s took %.1f s on %s; tests must finish in 30 s (CONTRIBUTING.md)\n", name, max[name], ENVIRON["RUNNER_OS"] }' ctest.log
      - name: Stage Windows test package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageRoot = Join-Path $env:RUNNER_TEMP 'anyps5-windows-x64'
          $packageLibs = Join-Path $packageRoot 'libs'
          $relinker = 'build/core/relinker/relinker.exe'
          $builtLibs = 'build/core/libs/libs'
          if (-not (Test-Path -LiteralPath $relinker -PathType Leaf)) { throw "Missing Windows relinker: $relinker" }
          if (-not (Test-Path -LiteralPath $builtLibs -PathType Container)) { throw "Missing built system libraries: $builtLibs" }
          $libraries = @(Get-ChildItem -LiteralPath $builtLibs -File -Filter '*.prx')
          if ($libraries.Count -eq 0) { throw "No patched system .prx libraries found in $builtLibs" }
          New-Item -ItemType Directory -Force -Path $packageLibs | Out-Null
          Copy-Item -LiteralPath $relinker -Destination $packageRoot
          $libraries | Copy-Item -Destination $packageLibs
          Copy-Item -LiteralPath 'LICENSE' -Destination $packageRoot
          Copy-Item -LiteralPath 'README.md' -Destination $packageRoot
          Copy-Item -LiteralPath 'docs/user/USAGE.md' -Destination (Join-Path $packageRoot 'USAGE.md')
          Copy-Item -LiteralPath 'docs/dev/BUILD.md' -Destination (Join-Path $packageRoot 'BUILD.md')
          @(
            'AnyPS5 Windows x64 CI test package'
            'Source commit: ${{ needs.eligibility.outputs.sha }}'
            'Source repository: https://github.com/${{ github.repository }}'
            ''
            'relinker.exe converts supported input ELF files into host executables.'
            'Example: .\relinker.exe --windows source\input.elf app.exe'
            'Refer to USAGE.md for the required input folders and app0/ layout.'
            'Copy the packaged libs/*.prx beside your converted app.exe in its libs/ folder.'
            'Additional runtime dependencies and game assets may be required.'
            ''
            'This package contains no games, firmware or keys.'
            'Successful CI compilation and tests do not establish title compatibility.'
            'Check third-party dependency licensing before redistributing binaries.'
          ) | Set-Content -LiteralPath (Join-Path $packageRoot 'TESTING.txt') -Encoding utf8
          Write-Host "Staged $($libraries.Count) compatibility libraries for download"
      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: anyps5-windows-x64-${{ github.run_number }}
          path: ${{ runner.temp }}/anyps5-windows-x64/
          if-no-files-found: error
          retention-days: 14
